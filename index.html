<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olimpíada da Advocacia</title>
  
  <!-- Importando DaisyUI e Tailwind via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.0/dist/full.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white">

  <!-- ================= SEÇÃO FALE CONOSCO ================= -->
  <section class="max-w-6xl mx-auto px-4 py-16 font-sans">
    <h2 class="text-3xl font-bold text-red-600 mb-8">Fale conosco</h2>

    <form action="#" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-8">
      
      <!-- Coluna Esquerda: Inputs de Dados -->
      <div class="flex flex-col gap-4">
        <!-- Input: Nome -->
        <div class="form-control w-full">
          <label class="label">
            <span class="label-text font-bold text-gray-700">Nome</span>
          </label>
          <input type="text" placeholder="Digite o seu nome" class="input input-bordered w-full bg-white border-gray-200" />
        </div>

        <!-- Input: E-mail -->
        <div class="form-control w-full">
          <label class="label">
            <span class="label-text font-bold text-gray-700">E-mail</span>
          </label>
          <input type="email" placeholder="Digite o seu e-mail" class="input input-bordered w-full bg-white border-gray-200" />
        </div>

        <!-- Input: Ocupação -->
        <div class="form-control w-full">
          <label class="label">
            <span class="label-text font-bold text-gray-700">Ocupação</span>
          </label>
          <input type="text" placeholder="Digite a sua ocupação" class="input input-bordered w-full bg-white border-gray-200" />
        </div>
      </div>

      <!-- Coluna Direita: Mensagem e Botão -->
      <div class="flex flex-col gap-4">
        <!-- Textarea: Mensagem -->
        <div class="form-control h-full flex-grow">
          <label class="label">
            <span class="label-text font-bold text-gray-700">Mensagem</span>
          </label>
          <textarea placeholder="Digite a mensagem" class="textarea textarea-bordered w-full h-full min-h-[160px] bg-white border-gray-200 resize-none"></textarea>
        </div>
        
        <!-- Botão de Envio -->
        <div class="flex justify-end mt-2">
          <button type="submit" class="btn border-none bg-[#008de3] hover:bg-blue-600 text-white px-8 rounded-lg capitalize">
            Enviar e-mail
          </button>
        </div>
      </div>
    </form>
  </section>

  <!-- ================= FOOTER INSTITUCIONAL ================= -->
  <footer class="bg-[#f5f5f5] text-gray-700 py-10 font-sans mt-12">
    <div class="max-w-6xl mx-auto px-4 flex flex-col items-center">
      
      <!-- Grid Superior do Footer -->
      <div class="w-full flex flex-col md:flex-row items-center justify-between gap-8 pb-8 border-b border-gray-300">
        
        <!-- Logo (Substituído por SVG embutido) -->
        <div class="flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" class="h-12 w-auto" aria-label="Olimpíadas da Advocacia CONCAD 2023">
            <!-- Ícone da Chama / Atleta -->
            <g transform="translate(5, 0)">
              <!-- Chama Vermelha Superior -->
              <path d="M 42 12 C 52 18, 68 25, 60 38 C 50 48, 38 48, 36 44 C 42 42, 52 36, 48 26 C 45 20, 38 16, 42 12 Z" fill="#E52321" />
              <!-- Chama Vermelha Esquerda -->
              <path d="M 30 10 C 35 18, 33 28, 25 36 C 22 28, 24 20, 30 10 Z" fill="#E52321" />
              <!-- Atleta / Chama Azul -->
              <path d="M 24 40 C 28 32, 34 26, 38 22 C 34 32, 28 42, 28 52 C 28 62, 36 72, 42 84 C 32 76, 22 64, 22 52 C 22 46, 23 42, 24 40 Z" fill="#008DE3" />
              <!-- Cabeça do Atleta Azul -->
              <circle cx="23" cy="38" r="3.5" fill="#008DE3" />
            </g>

            <!-- Texto do Logótipo -->
            <g fill="#373737" font-family="Arial, Helvetica, sans-serif" font-weight="900">
              <text x="85" y="30" font-size="21" letter-spacing="0.5">OLIMPÍADAS</text>
              <text x="85" y="54" font-size="21" letter-spacing="0.5">DA ADVOCACIA</text>
              <text x="85" y="75" font-size="15" font-weight="700" fill="#555555" letter-spacing="1">CONCAD 2023</text>
            </g>
          </svg>
        </div>

        <!-- Menu Secundário / Navegação -->
        <nav class="flex flex-wrap justify-center gap-6 font-semibold text-sm">
          <a href="#" class="text-[#008de3] hover:underline">Home</a>
          <a href="#" class="hover:text-[#008de3] transition-colors">Modalidades</a>
          <a href="#" class="hover:text-[#008de3] transition-colors">Agenda</a>
          <a href="#" class="hover:text-[#008de3] transition-colors">Resultados</a>
          <a href="#" class="hover:text-[#008de3] transition-colors">Canais</a>
          <a href="#" class="hover:text-[#008de3] transition-colors">Regulamento</a>
        </nav>

        <!-- Ícone de Rede Social -->
        <div class="flex-shrink-0">
          <a href="#" class="text-[#008de3] hover:text-blue-700 transition-colors" aria-label="Instagram">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="w-7 h-7">
              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
            </svg>
          </a>
        </div>
      </div>

      <!-- Direitos Autorais -->
      <div class="mt-6 text-xs text-center text-gray-500 font-medium">
        2023 HC Sports. Todos os direitos reservados.
      </div>
    </div>
  </footer>

</body>
</html>
