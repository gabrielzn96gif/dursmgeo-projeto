<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-base-200">

    <div class="drawer lg:drawer-open">

        <input id="menu-drawer" type="checkbox" class="drawer-toggle">

        <div class="drawer-content">

            <!-- Header -->
            <header class="navbar bg-base-100 border-b border-base-300 px-4 lg:px-8">

                <div class="flex-none lg:hidden">
                    <label for="menu-drawer" class="btn btn-square btn-ghost">
                        <svg xmlns="http://www.w3.org/2000/svg"
                            class="h-6 w-6"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </label>
                </div>

                <div class="flex-1">
                    <a class="text-xl font-bold">
                        Dashboard
                    </a>
                </div>

                <div class="flex-none">
                    <div class="dropdown dropdown-end">
                        <button class="btn btn-ghost btn-circle avatar">
                            <div class="w-10 rounded-full bg-primary text-primary-content flex items-center justify-center">
                                <span class="font-bold">U</span>
                            </div>
                        </button>

                        <ul class="menu menu-sm dropdown-content bg-base-100 rounded-box z-50 mt-3 w-52 p-2 shadow">
                            <li>
                                <a>Perfil</a>
                            </li>
                            <li>
                                <a>Configurações</a>
                            </li>
                            <li>
                                <a>Sair</a>
                            </li>
                        </ul>
                    </div>
                </div>

            </header>

            <!-- Conteúdo principal -->
            <main class="p-6 lg:p-8">

                <div class="mb-8">
                    <h1 class="text-3xl font-bold">
                        Produtos
                    </h1>

                    <p class="mt-2 text-base-content/60">
                        Confira os produtos disponíveis.
                    </p>
                </div>

                <!-- Área reservada para os produtos -->
                <section id="produtos">
                    <!-- Os cards dos produtos serão adicionados pela Pessoa 2 -->
                </section>

            </main>

        </div>

        <!-- Sidebar -->
        <div class="drawer-side">
            <label for="menu-drawer" class="drawer-overlay"></label>

            <aside class="min-h-full w-72 bg-base-100 border-r border-base-300">

                <!-- Logo -->
                <div class="flex h-20 items-center border-b border-base-300 px-6">
                    <a href="index.html" class="text-2xl font-bold text-primary">
                        Dashboard
                    </a>
                </div>

                <!-- Menu -->
                <nav class="p-4">

                    <p class="mb-2 px-4 text-xs font-semibold uppercase text-base-content/50">
                        Menu
                    </p>

                    <ul class="menu w-full gap-1">

                        <li>
                            <a href="index.html" class="active">
                                <svg xmlns="http://www.w3.org/2000/svg"
                                    class="h-5 w-5"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M3 12l9-9 9 9M5 10v10h14V10M9 20v-6h6v6" />
                                </svg>

                                Dashboard
                            </a>
                        </li>

                        <li>
                            <a href="#produtos">
                                <svg xmlns="http://www.w3.org/2000/svg"
                                    class="h-5 w-5"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                                </svg>

                                Produtos
                            </a>
                        </li>

                        <li>
                            <a href="compra.html">
                                <svg xmlns="http://www.w3.org/2000/svg"
                                    class="h-5 w-5"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M12 8c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3-1.343-3-3-3z" />
                                    <path stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M19 12a7 7 0 01-7 7m7-7a7 7 0 00-7-7m7 7h2m-9 7a7 7 0 01-7-7m7 7v2m-7-9a7 7 0 017-7m-7 7H3" />
                                </svg>

                                Comprar créditos
                            </a>
                        </li>

                    </ul>

                    <div class="divider"></div>

                    <p class="mb-2 px-4 text-xs font-semibold uppercase text-base-content/50">
                        Conta
                    </p>

                    <ul class="menu w-full gap-1">

                        <li>
                            <a href="#">
                                <svg xmlns="http://www.w3.org/2000/svg"
                                    class="h-5 w-5"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>

                                Perfil
                            </a>
                        </li>

                        <li>
                            <a href="#">
                                <svg xmlns="http://www.w3.org/2000/svg"
                                    class="h-5 w-5"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37a1.724 1.724 0 002.572-1.065z" />
                                    <path stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>

                                Configurações
                            </a>

                    </ul>

                </nav>

            </aside>
        </div>

    </div>

</body>
</html>
