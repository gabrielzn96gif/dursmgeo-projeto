<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realização e Organização</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />

  <style>
    .logo-card {
      min-height: 42px;
    }
    .logo-card img {
      display: block;
      max-width: 100%;
      max-height: 27px;
      width: auto;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body class="m-0 bg-black">

  <!-- seção completa -->
  <section id="realizacao-organizacao" class="w-full bg-black px-5 py-10 sm:px-8 sm:py-12">
    <div class="mx-auto w-full max-w-4xl">

      <!-- realização -->
      <div class="mb-10 sm:mb-12">
        <h2 class="mb-6 text-center text-xl font-bold text-white sm:mb-7 sm:text-2xl">
          Realização
        </h2>

        <div class="grid grid-cols-1 justify-items-center gap-3 sm:grid-cols-3 sm:gap-4">
          <div class="card logo-card flex w-full max-w-[150px] items-center justify-center rounded-md bg-white px-3 py-2 shadow-sm sm:max-w-[170px]">
            <img src="assets/img/logo1.png" alt="Logo da realização 1">
          </div>

          <div class="card logo-card flex w-full max-w-[150px] items-center justify-center rounded-md bg-white px-3 py-2 shadow-sm sm:max-w-[170px]">
            <img src="assets/img/logo1.png" alt="Logo da realização 2">
          </div>

          <div class="card logo-card flex w-full max-w-[150px] items-center justify-center rounded-md bg-white px-3 py-2 shadow-sm sm:max-w-[170px]">
            <img src="assets/img/logo1.png" alt="Logo da realização 3">
          </div>
        </div>
      </div>

      <!-- organização -->
      <div>
        <h2 class="mb-6 text-center text-xl font-bold text-white sm:mb-7 sm:text-2xl">
          Organização
        </h2>

        <div class="grid grid-cols-1 justify-items-center gap-3 sm:grid-cols-3 sm:gap-4">
          <div class="card logo-card flex w-full max-w-[150px] items-center justify-center rounded-md bg-white px-3 py-2 shadow-sm sm:max-w-[170px]">
            <img src="assets/img/logo2.png" alt="Logo da organização 1">
          </div>

          <div class="card logo-card flex w-full max-w-[150px] items-center justify-center rounded-md bg-white px-3 py-2 shadow-sm sm:max-w-[170px]">
            <img src="assets/img/logo2.png" alt="Logo da organização 2">
          </div>

          <div class="card logo-card flex w-full max-w-[150px] items-center justify-center rounded-md bg-white px-3 py-2 shadow-sm sm:max-w-[170px]">
            <img src="assets/img/logo2.png" alt="Logo da organização 3">
          </div>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
